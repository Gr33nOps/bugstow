services:
  bugstow:
    build: .
    image: bugstow:latest
    container_name: bugstow
    restart: unless-stopped
    ports:
      # host:container — change the host port if 8080 is taken.
      - '8080:8080'
    env_file:
      - .env
    volumes:
      # SQLite database + screenshots persist here across restarts/upgrades.
      - bugstow-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  bugstow-data:
