# Offline deployment: runs a pre-built image loaded with `docker load` — it never
# builds or pulls anything from the network.
#
#   docker load -i bugstow-image.tar
#   docker compose -f docker-compose.offline.yml up -d
#
# See docs/OFFLINE.md.
services:
  bugstow:
    image: bugstow:latest
    # Never download anything: the image must come from `docker load`.
    pull_policy: never
    container_name: bugstow
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    volumes:
      - bugstow-data:/data
      # Optional second backup copy on separate hardware (USB disk, other drive,
      # NAS mount). Uncomment, point the left side at that folder, and set
      # BUGSTOW_BACKUP_EXTERNAL_DIR=/backup-external in .env. See docs/RELEASE_OFFLINE.md §8.
      # - /mnt/usb-backup/bugstow:/backup-external
    healthcheck:
      # Works over HTTP and HTTPS (BUGSTOW_TLS=true).
      test: ['CMD', 'node', 'healthcheck.mjs']
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  bugstow-data:
