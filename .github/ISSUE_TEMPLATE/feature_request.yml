name: Suggest an improvement
description: Share a problem BugsTow could solve better.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and what gets in your way.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help?
      description: A specific change, example, or alternative you have considered.
    validations:
      required: true
